[package]
name = "osl_importer"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["cli"]
database = ["dep:osl_db", "dep:sqlx"]
cli = [
  "database",
  "dep:clap",
  "dep:dotenvy",
  "dep:tokio",
  "dep:osl_telemetry",
]

[[bin]]
name = "import"
path = "src/bin/import/main.rs"
required-features = ["cli"]

[dependencies]
osl_db = { path = "../osl_db", optional = true }
osl_telemetry = { path = "../osl_telemetry", optional = true }
osl_domain = { path = "../osl_domain" }
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true, features = ["env"] }
csv.workspace = true
dotenvy = { workspace = true, optional = true }
hmac.workspace = true
rust_decimal.workspace = true
serde.workspace = true
sha2.workspace = true
toml.workspace = true
sqlx = { workspace = true, optional = true, features = [
  "runtime-tokio",
  "macros",
  "chrono",
  "rust_decimal",
  "uuid",
] }
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
uuid.workspace = true
