[package]
name = "osl_api"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
osl_db = { path = "../osl_db" }
osl_telemetry = { path = "../osl_telemetry" }
osl_domain = { path = "../osl_domain", features = ["utoipa"] }
anyhow.workspace = true
chrono.workspace = true
dotenvy.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "sync",
  "time",
] }
tracing.workspace = true
metrics.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
uuid.workspace = true
axum = "0.8.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = [
  "cors",
  "trace",
  "timeout",
  "request-id",
  "compression-gzip",
  "compression-br",
] }
utoipa = { workspace = true, features = ["axum_extras", "chrono", "decimal", "uuid"] }
utoipa-swagger-ui = { version = "10.0.0", features = ["axum"] }

opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
tracing-opentelemetry = "0.34.0"
metrics-exporter-prometheus = "0.18.3"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", features = ["testing"] }
osl_importer = { path = "../osl_importer", default-features = false, features = ["database"] }
http-body-util = "0.1.3"
sqlx = { workspace = true, features = ["runtime-tokio", "macros", "migrate"] }
tokio = { workspace = true, features = ["test-util"] }
