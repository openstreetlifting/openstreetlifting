frontend:
  image:
    repository: ghcr.io/openstreetlifting/frontend
    tag: sha-9df75f3
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 3000
  env:
    backendUrl: "http://openstreetlifting-backend:8080"
backend:
  image:
    repository: ghcr.io/openstreetlifting/backend
    tag: sha-4f6ca6c
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8080
  config:
    host: "0.0.0.0"
    port: 8080
    logFormat: "json"
  database:
    secretName: osl-postgres-app
    urlKey: uri
ingress:
  frontendHost: "localhost"
  backendHost: "localhost"
  tls: false
