# Anything other than "production" is treated as a pre-release environment and
# shows the commit in the footer instead of a version.
environment: ""
frontend:
  image:
    repository: ghcr.io/openstreetlifting/frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 3000
  env:
    backendUrl: "http://openstreetlifting-backend:8080"
    siteUrl: "https://openstreetlifting.org"
    umamiScriptUrl: "https://umami.adrienpelfresne.com/script.js"
    umamiWebsiteId: "01a3177c-6b2e-4b8e-802b-6b9d26ece8ef"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
backend:
  image:
    repository: ghcr.io/openstreetlifting/backend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8080
  config:
    host: "0.0.0.0"
    port: 8080
    logFormat: "json"
  database:
    secretName: osl-postgres-app
    urlKey: uri
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  existingSecret: osl-backend-secret
  # Sealed against one cluster's key and one namespace, so only a deployment
  # repository can fill this in.
  sealedSecret:
    encryptedData: {}
importer:
  image:
    repository: ghcr.io/openstreetlifting/importer
    tag: ""
    pullPolicy: IfNotPresent
  # Every deploy makes the database match the canonical files, deletions
  # included. Drop --yes to have a release only report what it would remove.
  args: ["bulk-import", "--prune", "--yes"]
  instagramArgs: ["instagram"]
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  # Rendered on demand for a run outside a deploy, never installed with the
  # release.
  job:
    enabled: false
ingress:
  frontendHost: ""
  backendHost: ""
  tls: false
  noindex: false
