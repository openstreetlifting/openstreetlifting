frontend:
  image:
    repository: ghcr.io/openstreetlifting/frontend
    tag: 0.8.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 3000
  env:
    backendUrl: "http://openstreetlifting-backend:8080"
backend:
  image:
    repository: ghcr.io/openstreetlifting/backend
    tag: 0.8.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8080
  config:
    host: "0.0.0.0"
    port: 8080
    logFormat: "json"
  database:
    secretName: osl-postgres-app
    urlKey: uri
importer:
  image:
    repository: ghcr.io/openstreetlifting/importer
    tag: 0.8.0
    pullPolicy: IfNotPresent
  # Every deploy makes the database match the canonical files, deletions
  # included. Drop --yes to have a release only report what it would remove.
  args: ["bulk-import", "--prune", "--yes"]
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  # Rendered on demand for a run outside a deploy, never installed with the
  # release.
  job:
    enabled: false
ingress:
  frontendHost: "localhost"
  backendHost: "localhost"
  tls: false
