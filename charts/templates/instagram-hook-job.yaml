apiVersion: batch/v1
kind: Job
metadata:
  name: openstreetlifting-instagram
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openstreetlifting.labels" . | nindent 4 }}
    {{- include "openstreetlifting.importer.selectorLabels" . | nindent 4 }}
  annotations:
    # A handle can only attach to an athlete an import has already created, so
    # the weight keeps this behind openstreetlifting-import.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.importer.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.importer.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "openstreetlifting.importer.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "openstreetlifting.importer.podSpec" (dict "root" . "args" .Values.importer.instagramArgs) | nindent 6 }}
