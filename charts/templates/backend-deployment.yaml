apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstreetlifting-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openstreetlifting.labels" . | nindent 4 }}
    {{- include "openstreetlifting.backend.selectorLabels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 2
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "openstreetlifting.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openstreetlifting.backend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.config.port | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: openstreetlifting-backend-config
            - secretRef:
                name: osl-backend-secret
          env:
            # Published by the Postgres operator, so a rotated password costs
            # a pod restart and nothing else.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.secretName }}
                  key: {{ .Values.backend.database.urlKey }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
