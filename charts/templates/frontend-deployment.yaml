apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstreetlifting-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openstreetlifting.labels" . | nindent 4 }}
    {{- include "openstreetlifting.frontend.selectorLabels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 2
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "openstreetlifting.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openstreetlifting.frontend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ include "openstreetlifting.image" (dict "image" .Values.frontend.image "chart" .Chart) }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: {{ .Values.frontend.env.logLevel | quote }}
            - name: OTEL_SERVICE_NAME
              value: "osl-frontend"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.telemetry.traceSampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.telemetry.traceSampleRatio | quote }}
            - name: BACKEND_URL
              value: {{ .Values.frontend.env.backendUrl | quote }}
            - name: PUBLIC_SITE_URL
              value: {{ .Values.frontend.env.siteUrl | quote }}
            - name: PORT
              value: {{ .Values.frontend.service.port | quote }}
            - name: PUBLIC_APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: PUBLIC_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- if eq .Values.environment "production" }}
            - name: PUBLIC_UMAMI_SCRIPT_URL
              value: {{ .Values.frontend.env.umamiScriptUrl | quote }}
            - name: PUBLIC_UMAMI_WEBSITE_ID
              value: {{ .Values.frontend.env.umamiWebsiteId | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
