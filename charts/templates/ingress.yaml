{{- range $target := list "frontend" "backend" }}
{{- $host := index $.Values.ingress (printf "%sHost" $target) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openstreetlifting-{{ $target }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "openstreetlifting.labels" $ | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- $middlewares := list }}
    {{- if $.Values.ingress.rateLimit.enabled }}
    {{- $middlewares = append $middlewares (printf "%s-openstreetlifting-ratelimit-%s@kubernetescrd" $.Release.Namespace $target) }}
    {{- end }}
    {{- if $.Values.ingress.noindex }}
    {{- $middlewares = append $middlewares (printf "%s-openstreetlifting-noindex@kubernetescrd" $.Release.Namespace) }}
    {{- end }}
    {{- if $.Values.ingress.basicAuth.sealedUsers }}
    {{- $middlewares = append $middlewares (printf "%s-openstreetlifting-basic-auth@kubernetescrd" $.Release.Namespace) }}
    {{- end }}
    {{- with $middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," . }}
    {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openstreetlifting-{{ $target }}
                port:
                  name: http
  {{- if $.Values.ingress.tls }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: openstreetlifting-{{ $target }}-tls
  {{- end }}
{{- end }}
