      type: path
      description: Competition slug
  body:
    type: json
    data: |-
      {
        "city": "",
        "country": "",
        "end_date": "",
        "federation_id": "",
        "name": "",
        "number_of_judge": "",
        "slug": "",
        "start_date": "",
