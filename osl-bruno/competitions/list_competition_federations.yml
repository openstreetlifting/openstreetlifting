info:
  name: list_competition_federations
  type: http
  seq: 3
  tags:
    - competitions

http:
  method: GET
  url: "{{baseUrl}}/api/v1/competitions/federations"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Federations that have run at least one competition, alphabetical
    request:
      url: "{{baseUrl}}/api/v1/competitions/federations"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            ""
          ]
