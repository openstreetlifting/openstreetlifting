info:
  name: create_competition
  type: http
  seq: 2
  tags:
    - competitions

http:
  method: POST
  url: "{{baseUrl}}/api/v1/competitions"
  body:
    type: json
    data: |-
      {
        "city": "",
        "country": "",
        "end_date": "",
        "federation_id": "",
        "name": "",
        "number_of_judge": "",
        "slug": "",
        "start_date": "",
        "status": "",
        "venue": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Competition created
    request:
      url: "{{baseUrl}}/api/v1/competitions"
      method: POST
      body:
        type: json
        data: |-
          {
            "city": "",
            "country": "",
            "end_date": "",
            "federation_id": "",
            "name": "",
            "number_of_judge": "",
            "slug": "",
            "start_date": "",
            "status": "",
            "venue": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "categories": "",
            "city": "",
            "competition_id": "",
            "country": "",
            "created_at": "",
            "end_date": "",
            "federation": "",
