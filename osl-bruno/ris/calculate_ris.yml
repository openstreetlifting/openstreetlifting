info:
  name: calculate_ris
  type: http
  seq: 2
  tags:
    - ris

http:
  method: POST
  url: "{{baseUrl}}/api/v1/ris/calculations"
  body:
    type: json
    data: |-
      {
        "bodyweight": "",
        "formula_year": "",
        "gender": "",
        "total": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: RIS computed successfully
    request:
      url: "{{baseUrl}}/api/v1/ris/calculations"
      method: POST
      body:
        type: json
        data: |-
          {
            "bodyweight": "",
            "formula_year": "",
            "gender": "",
            "total": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "formula_year": 0,
            "ris_score": ""
          }
  - name: 400 Response
    description: Invalid request
    request:
      url: "{{baseUrl}}/api/v1/ris/calculations"
      method: POST
      body:
        type: json
        data: |-
          {
            "bodyweight": "",
            "formula_year": "",
            "gender": "",
            "total": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
