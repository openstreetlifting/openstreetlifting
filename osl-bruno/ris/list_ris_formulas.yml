info:
  name: list_ris_formulas
  type: http
  seq: 3
  tags:
    - ris

http:
  method: GET
  url: "{{baseUrl}}/api/v1/ris/formulas"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: List all RIS formula versions
    request:
      url: "{{baseUrl}}/api/v1/ris/formulas"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "constants": {
                "men": {
                  "a": "",
                  "b": "",
                  "k": "",
                  "q": "",
                  "v": ""
                },
                "women": {
                  "a": "",
                  "b": "",
                  "k": "",
                  "q": "",
                  "v": ""
                }
              },
              "effective_from": "",
              "effective_until": "",
              "formula_id": "",
              "is_current": false,
              "year": 0
            }
          ]
