info:
  name: list_ris_formulas
  type: http
  seq: 3
  tags:
    - ris

http:
  method: GET
  url: "{{baseUrl}}/api/v1/ris/formulas"
  params:
    - name: year
      value: "2026"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Filter by year
    description: A year filter returns a collection containing the matching edition
    request:
      url: "{{baseUrl}}/api/v1/ris/formulas"
      method: GET
      params:
        - name: year
          value: "2026"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "year": 2026,
              "is_current": true,
              "constants": {
                "men": {
                  "a": 335.5625,
                  "k": 556.1103380806655,
                  "b": 0.10289374204365953,
                  "v": 76.74125992622565,
                  "q": 0.4973075488457353
                },
                "women": {
                  "a": 189.0625,
                  "k": 281.8317115772956,
                  "b": 0.28812554082125424,
                  "v": 69.83492229989282,
                  "q": 0.004337919108356886
                }
              }
            }
          ]
  - name: Unpublished year
    request:
      url: "{{baseUrl}}/api/v1/ris/formulas"
      method: GET
      params:
        - name: year
          value: "1900"
          type: query
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: "[]"
