info:
  name: list_athletes
  type: http
  seq: 1
  tags:
    - athletes

http:
  method: GET
  url: "{{baseUrl}}/api/v1/athletes"
  params:
    - name: page
      value: "0"
      type: query
      disabled: true
    - name: page_size
      value: "0"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: A page of athletes
    request:
      url: "{{baseUrl}}/api/v1/athletes"
      method: GET
      params:
        - name: page
          value: "0"
          type: query
          disabled: true
        - name: page_size
          value: "0"
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "athlete_id": "",
                "competitions": "",
                "country": "",
                "created_at": "",
                "first_name": "",
                "gender": "",
                "last_name": "",
                "nationality": "",
                "personal_records": "",
                "profile_picture_url": "",
                "slug": "",
                "total_competitions": ""
              }
            ],
            "pagination": {
              "page": 0,
              "page_size": 0,
              "total_items": 0,
              "total_pages": 0
            }
          }
  - name: 400 Response
    description: Invalid pagination parameters
    request:
      url: "{{baseUrl}}/api/v1/athletes"
      method: GET
      params:
        - name: page
          value: "0"
          type: query
          disabled: true
        - name: page_size
          value: "0"
