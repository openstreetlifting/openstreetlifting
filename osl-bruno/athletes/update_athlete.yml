info:
  name: update_athlete
  type: http
  seq: 5
  tags:
    - athletes

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/athletes/:slug"
  params:
    - name: slug
      value: ""
      type: path
      description: Athlete slug
  body:
    type: json
    data: |-
      {
        "country": "",
        "first_name": "",
        "gender": "",
        "last_name": "",
        "nationality": "",
        "profile_picture_url": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

