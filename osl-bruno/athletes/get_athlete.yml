info:
  name: get_athlete
  type: http
  seq: 3
  tags:
    - athletes

http:
  method: GET
  url: "{{baseUrl}}/api/v1/athletes/:slug"
  params:
    - name: slug
      value: adrien-pelfresne
      type: path
      description: Athlete slug
    - name: include
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

