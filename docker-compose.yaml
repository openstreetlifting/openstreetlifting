services:
  postgres:
    image: postgres:18
    container_name: openstreetlifting_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apppassword}
      POSTGRES_DB: ${DB_NAME:-appdb}
    shm_size: 128mb
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BIN: osl_api
    container_name: openstreetlifting_web_api
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      METRICS_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-appuser}:${DB_PASSWORD:-apppassword}@postgres:5432/${DB_NAME:-appdb}
    ports:
      - "${PORT:-8080}:8080"
      - "127.0.0.1:9090:9090"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  importer:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BIN: import
    container_name: openstreetlifting_importer
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-appuser}:${DB_PASSWORD:-apppassword}@postgres:5432/${DB_NAME:-appdb}
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
