rm="translate(1921.35,343.40) scale(0.24278,-0.24278)"/></g><g transform="translate(671.55,0)"><path d="M260 0H105Q69 0 69 36V684Q69 720 105 720H551Q587 720 587 684V565Q587 529 551 529H296V425H470Q506 425 506 389V269Q506 233 470 233H296V36Q296 0 260 0Z" transform="translate(1919.77,343.40) scale(0.24278,-0.24278)"/></g><g transform="translate(829.69,0)"><path d="M409 0H247Q211 0 211 36V527H64Q28 527 28 563V684Q28 720 64 720H592Q628 720 628 684V563Q628 527 592 527H445V36Q445 0 409 0Z" transform="translate(1915.16,343.40) scale(0.24278,-0.24278)"/></g><g transform="translate(986.26,0)"><path d="M89 0Q53 0 53 36V155Q53 191 89 191H188V527H89Q53 527 53 563V684Q53 720 89 720H515Q551 720 551 684V563Q551 527 515 527H418V191H515Q551 191 551 155V36Q551 0 515 0Z" transform="translate(1921.35,343.40) scale(0.24278,-0.24278)"/></g><g transform="translate(1154.60,0)"><path d="M255 0H105Q69 0 69 36V684Q69 720 105 720H209Q245 720 268 693L462 471V684Q462 720 498 720H648Q684 720 684 684V36Q684 0 648 0H498Q462 0 462 36V159L291 366V36Q291 0 255 0Z" transform="translate(1903.39,343.40) scale(0.24278,-0.24278)"/></g><g transform="translate(1335.45,0)"><path d="M619 0H304Q178 0 118.0 50.0Q58 100 58 204V516Q58 620 118.0 670.0Q178 720 304 720H554Q590 720 590 684V563Q590 527 554 527H346Q285 527 285 477V238Q285 189 331 189H428V345Q428 381 464 381H619Q655 381 655 345V36Q655 0 619 0Z" transform="translate(1908.85,343.40) scale(0.24278,-0.24278)"/></g></g>
</svg>
