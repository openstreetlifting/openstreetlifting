name: "Chart CI"

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Chart Changes
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ github.event_name == 'merge_group' || steps.filter.outputs.chart == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            chart:
              - 'charts/**'
              - '.github/workflows/ci-chart.yaml'

  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin
      - name: Lint chart
        run: helm lint charts/
      - name: Validate default rendering
        run: |
          helm template charts/ \
            | kubeconform -strict -summary -skip SealedSecret,Middleware
      - name: Package chart
        run: helm package charts/ --destination dist/

  ci-success:
    name: Chart CI Success
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, lint]
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
