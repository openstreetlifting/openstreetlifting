name: "Release to Production"
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IAC_REPO: dirdr/adrien_kubernetes_cluster

jobs:
  promote:
    name: Promote Staging to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout deployment repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.IAC_REPO }}
          ssh-key: ${{ secrets.IAC_DEPLOY_KEY }}
          path: iac

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # Production runs whatever staging has been running, so the promotion
      # source is the staging values file rather than a fresh build.
      - name: Read the tags staging is running
        id: tags
        run: |
          VALUES=iac/helm/openstreetlifting/values-staging.yaml
          {
            echo "frontend_sha=$(yq '.frontend.image.tag' $VALUES)"
            echo "backend_sha=$(yq '.backend.image.tag' $VALUES)"
            echo "importer_sha=$(yq '.importer.image.tag' $VALUES)"
            echo "semver=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Retag images
        env:
          SEMVER: ${{ steps.tags.outputs.semver }}
        run: |
          retag() {
            docker buildx imagetools create \
              -t "${{ env.REGISTRY }}/openstreetlifting/$1:$SEMVER" \
              -t "${{ env.REGISTRY }}/openstreetlifting/$1:latest" \
              "${{ env.REGISTRY }}/openstreetlifting/$1:$2"
          }
          retag frontend "${{ steps.tags.outputs.frontend_sha }}"
          retag backend "${{ steps.tags.outputs.backend_sha }}"
          retag importer "${{ steps.tags.outputs.importer_sha }}"

      - name: Point production at the release
        working-directory: iac
        env:
          SEMVER: ${{ steps.tags.outputs.semver }}
        run: |
          VALUES=helm/openstreetlifting/values-production.yaml
          for component in frontend backend importer; do
            yq -i ".$component.image.tag = \"$SEMVER\"" "$VALUES"
          done
          yq -i \
            "(.spec.sources[] | select(.ref != \"values\") | .targetRevision) = \"$GITHUB_REF_NAME\"" \
            apps/openstreetlifting.yaml

      - name: Commit
        working-directory: iac
        run: |
          git config user.name "osl-ci[bot]"
          git config user.email "315316499+osl-ci[bot]@users.noreply.github.com"
          git add helm/openstreetlifting/values-production.yaml apps/openstreetlifting.yaml
          git diff --cached --quiet || git commit \
            -m "chore(production): release ${{ steps.tags.outputs.semver }}" \
            -m "Promotes the images staging validated."
          git pull --rebase
          git push

      # Last, because Argo CD reads the chart from git. This artifact only
      # serves self-hosters, so a registry failure must not block the deploy.
      - name: Publish chart
        run: |
          helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}
          helm package charts/ --destination dist/
          helm push \
            "dist/openstreetlifting-${{ steps.tags.outputs.semver }}.tgz" \
            oci://${{ env.REGISTRY }}/openstreetlifting/charts
