name: "Backend CI"
on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/ci-backend.yaml
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'backend/Cargo.*'
              - 'backend/crates/**'
              - 'backend/scripts/**'
              - 'backend/.cargo/**'
              - 'backend/.sqlx/**'
              - 'backend/rust-toolchain*'
              - 'backend/openapi.json'
              - '.github/workflows/ci-backend.yaml'
            data:
              - 'backend/data/**'

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false
      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all -- --check

  imports:
    name: Import files
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.data == 'true'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openstreetlifting
          POSTGRES_PASSWORD: openstreetlifting
          POSTGRES_DB: openstreetlifting
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SQLX_OFFLINE: true
      DATABASE_URL: postgres://openstreetlifting:openstreetlifting@localhost:5432/openstreetlifting
      OSL_PRIVACY_KEY: ${{ secrets.OSL_PRIVACY_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: backend
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Check competitions files are prepared
        working-directory: backend
        run: cargo run --locked -p osl_importer --bin import -- prepare --check ./data/competitions ./data/staging/competitions
      - name: Run migrations
        working-directory: backend
        run: sqlx migrate run --source crates/osl_db/migrations
      - name: Import canonical files
        working-directory: backend
        run: |
          args=()
          if [[ "${{ github.event.pull_request.head.repo.fork }}" == "true" && -z "$OSL_PRIVACY_KEY" ]]; then
            args+=(--dry-run --skip-privacy-check)
          fi
          cargo run --locked -p osl_importer --bin import -- competitions \
            ./data/competitions \
            ./data/staging/competitions "${args[@]}"
      - name: Check nobody on the privacy list is named
        if: github.event.pull_request.head.repo.fork == false
        working-directory: backend
        run: cargo run --locked -p osl_importer --bin import -- privacy --directory ./data/competitions
      - name: Validate athlete social handles
        working-directory: backend
        run: |
          if [[ "${{ github.event.pull_request.head.repo.fork }}" == "true" && -z "$OSL_PRIVACY_KEY" ]]; then
            unset DATABASE_URL
          fi
          cargo run --locked -p osl_importer --bin import -- instagram --dry-run

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          cache-workspaces: backend
      - name: Run Clippy (all, pedantic, nursery, cargo)
        working-directory: backend
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check standalone domain and file tools have no infrastructure dependencies
        working-directory: backend
        run: |
          for package in osl_domain recover-bodyweight; do
            cargo check --locked -p "$package"
            cargo tree --locked -p "$package" --prefix none > "/tmp/$package-dependencies.txt"
            if grep -E '^(sqlx|osl_db|utoipa|tokio|tracing-subscriber)(-| )' "/tmp/$package-dependencies.txt"; then
              echo "$package must build without database, runtime or OpenAPI dependencies"
              exit 1
            fi
          done

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openstreetlifting
          POSTGRES_PASSWORD: openstreetlifting
          POSTGRES_DB: openstreetlifting
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://openstreetlifting:openstreetlifting@localhost:5432/openstreetlifting
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: backend
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli,cargo-nextest
      - name: Run migrations
        working-directory: backend
        run: sqlx migrate run --source crates/osl_db/migrations
      - name: Run tests
        working-directory: backend
        run: cargo nextest run --workspace --all-features --locked

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, format, imports, lint, test]
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
